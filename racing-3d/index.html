}

async function applyParentState(d){parentState={...parentState,...d,profile:{...parentState.profile,...d.profile,upgrades:{...parentState.profile.upgrades,...d.profile?.upgrades}}};mode=d.mode||mode;const track=d.game?.trackId||parentState.profile.trackId||'neon_city';buildWorld(track);if(myCarId!==parentState.profile.carId||carColor!==parentState.profile.color)await setMyCar(parentState.profile.carId,parentState.profile.color);if(mode==='garage'){driving=false;renderGarage(document.querySelector('.tabs .active')?.dataset.tab||'cars');progress=0;speed=0;fuel=100;nitro=100;$('#raceResult').classList.add('hidden')}else{driving=true;$('#garagePanel').classList.add('hidden');$('#garageBottom').style.display='none';$('#raceControls').hidden=false;$('#bars').style.display='grid';const mine=d.game?.cars?.[d.myId];if(mine){progress=Math.max(progress,Number(mine.progress||0));fuel=Number(mine.fuel??fuel);nitro=Number(mine.nitro??nitro);lane=Number(mine.lane??lane)}if(d.game?.winner){driving=false;const winner=d.game.players?.find(p=>p.id===d.game.winner);$('#raceResult').classList.remove('hidden');$('#resultTitle').textContent=d.game.winner===d.myId?'¡Victoria!':'Carrera terminada';$('#resultText').textContent=d.game.winner===d.myId?'+25 Coins. Los demás reciben +10.':`${winner?.name||'Otro jugador'} ha ganado. Recibes +10 Coins.`}else $('#raceResult').classList.add('hidden')}updateHUD();updateRivals();}

function animate(ts){requestAnimationFrame(animate);const dt=Math.min(.035,(ts-last)/1000||.016);last=ts;garageTurn+=dt;const st=statsFor();if(mode==='race'&&driving&&!parentState.game?.winner){const nitroOn=controls.nitro&&nitro>0&&speed>25;if(controls.gas&&fuel>0)speed+=st.accel*dt;else speed-=10*dt;if(controls.brake)speed-=st.brakes*dt;if(nitroOn){speed+=st.nitroBoost*dt;nitro-=22*dt}else nitro=Math.min(100,nitro+2.3*dt);speed=Math.max(0,Math.min(st.max+(nitroOn?38:0),speed));fuel=Math.max(0,fuel-speed*dt*.0019);if(fuel<=0)speed=Math.min(speed,65);const steer=(controls.left?-1:0)+(controls.right?1:0);lane=THREE.MathUtils.clamp(lane+steer*dt*(1.7+st.handling/55),-4.2,4.2);progress=Math.min(100,progress+speed*dt/105);if(myCar){myCar.position.x+=(lane-myCar.position.x)*.12;myCar.rotation.z+=(steer*-.07-myCar.rotation.z)*.12;const fx=myCar.getObjectByName('nitroFx');if(fx)fx.visible=nitroOn}roadMat?.map&&(roadMat.map.offset.y-=speed*dt*.0018);roadside.children.forEach(o=>{if(o.isMesh||o.isLight){o.position.z+=speed*dt*.045;if(o.position.z>26)o.position.z-=210}});if(ts-lastPost>360){post('race-tick',{progress,speed,fuel,nitro,lane});lastPost=ts}if(progress>=100){speed*=.98}}else if(mode==='garage'){if(myCar){myCar.rotation.y=Math.PI+garageTurn*.25;if(preview){roadMat?.map&&(roadMat.map.offset.y-=dt*.2);myCar.rotation.y=Math.PI}}}
