<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Streamer Arena · Retro Racing</title>
<style>
:root{--bg:#05070c;--panel:rgba(5,8,16,.92);--line:#2742dd;--text:#f4f7ff;--muted:#aebae0;--accent:#4bd1ff;--yellow:#ffd84f;--green:#7dff90;--red:#ff6b77}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:"Trebuchet MS",Verdana,Arial,sans-serif}button{font:inherit;color:inherit;background:rgba(20,30,90,.95);border:2px solid #4d63ff;border-radius:10px;padding:8px 12px;cursor:pointer}button:hover{border-color:#7ddfff}button.primary{background:linear-gradient(180deg,#3568ff,#1e3fc1)}button:disabled{opacity:.48;cursor:not-allowed}.root{position:relative;width:100%;height:100%;background:radial-gradient(circle at top,#1d243a,#05070c 72%)}#raceCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}.overlay{position:absolute;inset:0;pointer-events:none}.panel{background:var(--panel);border:2px solid #3550df;border-radius:14px;box-shadow:0 0 0 2px rgba(0,0,0,.35) inset}.garage{position:absolute;inset:18px;display:grid;grid-template-columns:1.2fr 1fr;gap:16px;padding:16px;pointer-events:auto}.garage.hidden{display:none}.titlebox{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.retro-title{font-size:34px;line-height:.92;font-weight:900;letter-spacing:.08em;text-shadow:2px 2px 0 #000;color:#ffdd69}.sub{display:block;font-size:12px;color:#9cb3ff;letter-spacing:.22em;text-transform:uppercase}.car-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}.car-card{padding:12px;min-height:136px}.car-card.selected{outline:3px solid #64e2ff}.sprite{height:58px;border-radius:10px;position:relative;margin-bottom:8px;overflow:hidden;background:linear-gradient(180deg,#3f4d9d,#1e2350)}.sprite .road{position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(90deg,#3b3b3b 0 10%,#818181 10% 20%,#3b3b3b 20% 30%,#818181 30% 40%,#3b3b3b 40% 50%,#818181 50% 60%,#3b3b3b 60% 70%,#818181 70% 80%,#3b3b3b 80% 90%,#818181 90% 100%)}.car-shape{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:112px;height:42px}.car-shape:before,.car-shape:after{content:"";position:absolute}.car-shape:before{inset:8px 8px 0 8px;border-radius:16px 24px 9px 9px;background:var(--c,#f2f4f7);box-shadow:0 0 0 3px rgba(0,0,0,.32) inset}.car-shape:after{left:26px;right:26px;top:2px;height:17px;border-radius:12px 12px 7px 7px;background:rgba(190,220,255,.45)}.wheel{position:absolute;bottom:1px;width:16px;height:16px;border-radius:50%;background:#edf4ff;border:3px solid #454545}.wheel.l{left:18px}.wheel.r{right:18px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.stat{font-size:12px;padding:6px 7px;border-radius:8px;background:#090d1a;border:1px solid rgba(255,255,255,.07)}.car-card small,.track-card small,.panel small,.upgrade small{display:block;color:var(--muted)}.car-card h3,.track-card h3{margin:2px 0 0 0}.track-list,.upgrade-list{display:grid;gap:10px;padding:16px}.track-card,.upgrade{padding:12px}.track-card.selected{outline:3px solid #64e2ff}.map{width:112px;height:92px;border:2px solid #4261ff;background:linear-gradient(180deg,#868686,#5f5f5f);margin-left:auto;position:relative;overflow:hidden}.map svg{position:absolute;inset:0;width:100%;height:100%}.sidecol{display:grid;grid-template-rows:auto 1fr auto;gap:14px}.economy{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px}.econ{padding:10px;border-radius:10px;background:#080d19;border:1px solid rgba(255,255,255,.06)}.econ b{font-size:20px}.garage-actions{display:flex;gap:10px;justify-content:flex-end;padding:0 16px 16px}.race-ui{position:absolute;inset:0;display:none}.race-ui.show{display:block}.viewport-label{position:absolute;left:12px;padding:6px 10px;background:rgba(0,0,0,.62);border:2px solid #3152ff;border-radius:10px;font-weight:900;letter-spacing:.08em}.viewport-label.bottom{top:calc(50% + 8px)}.viewport-label.top{top:8px}.split-divider{position:absolute;left:0;right:0;top:50%;height:4px;background:#2647ec;box-shadow:0 0 0 1px #0f1737 inset}.hudbox{position:absolute;right:12px;top:8px;padding:8px 10px;background:rgba(0,0,0,.62);border:2px solid #3152ff;border-radius:10px;font-weight:700;line-height:1.25;white-space:pre-line}.hudbox.bottom{top:auto;bottom:12px}.result{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:min(460px,90vw);padding:18px 20px;text-align:center;pointer-events:auto}.result.hidden{display:none}.result h2{margin:4px 0 8px;font-size:34px;color:#ffe26a;text-shadow:2px 2px 0 #000}.controls{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}.controls button{min-width:72px}.legend{position:absolute;left:12px;bottom:12px;padding:8px 10px;background:rgba(0,0,0,.6);border:2px solid #3152ff;border-radius:10px;font-size:12px;color:#dde7ff}.track-select-title{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08)}.upgrade-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.06);padding:9px 0}.upgrade-row:last-child{border-bottom:0}.pixel{font-family:"Courier New",monospace;font-style:italic;letter-spacing:.08em;text-transform:uppercase}
@media(max-width:1100px){.garage{grid-template-columns:1fr}.map{margin-left:0}.garage-actions{justify-content:stretch}.garage-actions button{flex:1}}
@media(max-width:760px){.retro-title{font-size:24px}.garage{inset:10px;padding:10px}.car-grid{grid-template-columns:1fr}.economy{grid-template-columns:1fr 1fr}.controls{left:10px;right:10px;transform:none;justify-content:center;flex-wrap:wrap}.controls button{flex:1 1 30%}}
</style></head><body>
<div class="root">
<canvas id="raceCanvas"></canvas>
<div class="overlay">
  <section id="garage" class="garage panel">
    <div class="panel" style="overflow:auto">
      <div class="titlebox"><div><span class="sub">Retro Racing</span><div class="retro-title pixel">Choose<br>Car Type</div></div><div><small class="sub" style="font-size:10px">Coins</small><div style="font-size:30px;font-weight:900;color:#ffd84f" id="coinCounter">0</div></div></div>
      <div class="car-grid" id="carGrid"></div>
    </div>
    <div class="sidecol">
      <div class="panel"><div class="economy"><div class="econ"><small>Coche</small><b id="carName">Falcon R</b></div><div class="econ"><small>Modo</small><b id="opponentMode">AI</b></div><div class="econ"><small>Pista</small><b id="trackName">Neon City</b></div></div></div>
      <div class="panel" style="overflow:auto">
        <div class="track-select-title pixel" style="font-size:24px">Location / Track</div>
        <div class="track-list" id="trackList"></div>
        <div class="track-select-title pixel" style="font-size:22px">Tuning</div>
        <div class="upgrade-list" id="tuningList"></div>
      </div>
      <div class="garage-actions"><button id="garageRefreshBtn">↻ Actualizar</button><button id="garagePreviewBtn" class="primary">▶ Vista previa</button></div>
    </div>
  </section>
  <section id="raceUI" class="race-ui">
    <div class="viewport-label top">PLAYER 1 · <span id="topLabel">IVAN</span></div>
    <div class="viewport-label bottom"><span id="bottomMode">AI</span> · <span id="bottomLabel">RIVAL</span></div>
    <div class="hudbox" id="hudTop"></div>
    <div class="hudbox bottom" id="hudBottom"></div>
    <div class="split-divider"></div>
    <div class="legend">W/↑ acelerar · A/D girar · S frenar · Shift/Espacio nitro</div>
    <div class="controls"><button id="leftBtn">◀</button><button id="gasBtn">▲ GAS</button><button id="brakeBtn">▼ BRAKE</button><button id="nitroBtn">NITRO</button><button id="rightBtn">▶</button></div>
    <div id="result" class="result panel hidden"><div class="sub">Resultados</div><h2 id="resultTitle">Meta</h2><p id="resultText"></p><button id="closeResultBtn" class="primary">Cerrar</button></div>
  </section>
</div>
</div>
<script>
const qs=new URLSearchParams(location.search);let mode=qs.get('mode')||'garage';
const CARS={falcon:{name:'Falcon R',price:0,max:188,accel:34,handling:66,nitro:64},vortex:{name:'Vortex GT',price:75,max:198,accel:37,handling:72,nitro:68},streetx:{name:'Street X',price:150,max:205,accel:40,handling:76,nitro:72},titan:{name:'Titan RS',price:250,max:216,accel:43,handling:80,nitro:78}};
const TRACKS={neon_city:{name:'Neon City',laps:3,bgTop:'#1b2137',bgBottom:'#0c1020',roadSide:'#202840',grass:'#11172b',curveSeq:[0,.2,.4,.1,-.3,-.55,-.1,.1,.4,0,-.2],map:'M10,78 C15,58 12,45 24,31 C36,17 54,17 62,29 C70,41 62,56 75,60 C88,64 96,44 98,18'},
 harbor_night:{name:'Harbor Night',laps:3,bgTop:'#182429',bgBottom:'#071116',roadSide:'#2d343f',grass:'#0b1015',curveSeq:[0,-.35,-.5,-.25,.15,.4,.55,.2,-.2,-.45],map:'M16,76 C14,58 18,44 28,35 C43,21 58,24 63,42 C67,55 54,67 66,76 C78,85 92,70 96,36'},
 desert_run:{name:'Desert Run',laps:3,bgTop:'#48bfff',bgBottom:'#e4b47f',roadSide:'#75492e',grass:'#d4a06e',curveSeq:[0,.15,.35,.55,.3,.05,-.2,-.45,-.35,-.1],map:'M12,66 C24,52 20,34 34,24 C52,12 64,18 74,30 C84,42 82,56 93,66'}};
const UP_NAMES={engine:'Motor',turbo:'Turbo',nitro:'Nitro',tires:'Neumáticos',brakes:'Frenos'};const COSTS=[25,50,75,100,150];
let parentState={myId:'',myName:'Jugador',coins:0,isHost:false,profile:{carId:'falcon',trackId:'neon_city',color:'#f2f4f7',ownedCars:['falcon'],upgrades:{engine:0,turbo:0,nitro:0,tires:0,brakes:0}},roomPlayers:[],game:null};
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const canvas=$('#raceCanvas'),ctx=canvas.getContext('2d');let W=0,H=0,ratio=1;
let keys={gas:false,brake:false,left:false,right:false,nitro:false};
let me={speed:0,lane:0,dist:0,nitro:100,fuel:100,lap:1,progress:0,finished:false,color:'#f2f4f7'};
let rival={speed:0,lane:0,dist:0,nitro:100,fuel:100,lap:1,progress:0,finished:false,name:'CPU',isAI:true,color:'#ff555d'};
let gameClock=0,last=performance.now(),previewMode=false,lastTickPost=0,localFinishedSent=false;
function post(type,data={}){ parent.postMessage({source:'sa-racing3d',type,...data},'*'); }
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function carStats(profile){ const car=CARS[profile.carId]||CARS.falcon; const u=profile.upgrades||{}; return {max:car.max+(u.engine||0)*6+(u.turbo||0)*3,accel:car.accel+(u.engine||0)*2.3+(u.turbo||0)*2.2,handling:car.handling+(u.tires||0)*4.2,brake:34+(u.brakes||0)*7,nitroBoost:44+(u.nitro||0)*4.5,baseNitro:100}; }
function currentTrack(){return TRACKS[parentState.game?.trackId||parentState.profile.trackId]||TRACKS.neon_city;}
function otherHuman(){const ids=(parentState.game?.playerIds||[]).filter(id=>id!==parentState.myId); return ids[0]||null;}
function opponentMode(){return parentState.game?.aiEnabled||!otherHuman()?'AI':'PLAYER 2';}
function roadCurveAt(pos){ const seq=currentTrack().curveSeq; const idx=Math.floor((pos/180)%seq.length); const frac=(pos/180)%1; const a=seq[(idx+seq.length)%seq.length],b=seq[(idx+1)%seq.length]; return lerp(a,b,frac); }
function totalTrackLength(){ return 2200; }
function setupRaceEntities(){ const gs=parentState.game; const meCar=gs?.cars?.[parentState.myId]; me.speed=Number(meCar?.speed||0); me.lane=Number(meCar?.lane||0); me.progress=Number(meCar?.progress||0); me.dist=me.progress/100*totalTrackLength(); me.nitro=Number(meCar?.nitro??100); me.fuel=Number(meCar?.fuel??100); me.finished=false; me.color=parentState.profile.color||'#f2f4f7'; me.lap=Math.min((gs?.laps||3),Math.floor(me.progress/(100/(gs?.laps||3)))+1);
  const oid=otherHuman(); if(oid && !gs?.aiEnabled){ const oc=gs.cars?.[oid]||{}; rival.name=(gs.players||[]).find(p=>p.id===oid)?.name||'Player 2'; rival.isAI=false; rival.color=String(oc.color||'#58b4ff'); rival.speed=Number(oc.speed||0); rival.lane=Number(oc.lane||0); rival.progress=Number(oc.progress||0); rival.dist=rival.progress/100*totalTrackLength(); rival.nitro=Number(oc.nitro??100); rival.fuel=Number(oc.fuel??100); rival.lap=Math.min((gs?.laps||3),Math.floor(rival.progress/(100/(gs?.laps||3)))+1); rival.finished=!!gs.winner; }
  else{ rival.name='CPU Night'; rival.isAI=true; rival.color='#ff555d'; rival.speed=130; rival.lane=0; rival.progress=0; rival.dist=0; rival.nitro=100; rival.fuel=100; rival.lap=1; rival.finished=false; }
  localFinishedSent=false; $('#bottomMode').textContent=opponentMode(); $('#topLabel').textContent=parentState.myName||'PLAYER 1'; $('#bottomLabel').textContent=rival.name; }
function applyParentState(d){ parentState={...parentState,...d,profile:{...parentState.profile,...(d.profile||{}),upgrades:{...parentState.profile.upgrades,...(d.profile?.upgrades||{})}}}; mode=d.mode||mode; $('#coinCounter').textContent=String(parentState.coins||0); $('#carName').textContent=CARS[parentState.profile.carId]?.name||'Falcon R'; $('#trackName').textContent=currentTrack().name; $('#opponentMode').textContent=opponentMode(); renderGarage(); if(mode==='race'){ $('#garage').classList.add('hidden'); $('#raceUI').classList.add('show'); setupRaceEntities(); $('#result').classList.add('hidden'); } else { $('#garage').classList.remove('hidden'); $('#raceUI').classList.remove('show'); }}
function renderGarage(){ const p=parentState.profile; const carGrid=$('#carGrid'); carGrid.innerHTML=Object.entries(CARS).map(([id,c])=>{ const own=(p.ownedCars||[]).includes(id); const sel=p.carId===id; return `<div class="car-card panel ${sel?'selected':''}"><div class="sprite"><div class="car-shape" style="--c:${p.color||'#f2f4f7'}"><div class="wheel l"></div><div class="wheel r"></div></div><div class="road"></div></div><h3>${c.name}</h3><small>${own?'En tu garaje':c.price+' Coins'}</small><div class="stats"><div class="stat">Vmax ${c.max}</div><div class="stat">Acel ${c.accel}</div><div class="stat">Giro ${c.handling}</div><div class="stat">Nitro ${c.nitro}</div></div><div style="display:flex;gap:8px;margin-top:10px">${own?`<button ${sel?'disabled':''} data-select-car="${id}">${sel?'Seleccionado':'Elegir'}</button>`:`<button data-buy-car="${id}">Comprar</button>`}</div></div>`; }).join('');
  const trackList=$('#trackList'); trackList.innerHTML=Object.entries(TRACKS).map(([id,t])=>`<div class="track-card panel ${p.trackId===id?'selected':''}"><div style="display:grid;grid-template-columns:1fr 124px;gap:10px;align-items:center"><div><h3>${t.name}</h3><small>${t.laps} vueltas · ${id==='desert_run'?'Desierto':'Ciudad'}</small><button style="margin-top:8px" data-track="${id}" ${(!parentState.isHost||p.trackId===id)?'disabled':''}>${p.trackId===id?'Elegida':parentState.isHost?'Elegir':'Solo host'}</button></div><div class="map"><svg viewBox="0 0 110 90"><rect width="110" height="90" fill="rgba(0,0,0,.25)"/><path d="${t.map}" fill="none" stroke="#f5f5f5" stroke-width="7" stroke-linecap="round"/><path d="${t.map}" fill="none" stroke="#f00" stroke-width="2" stroke-dasharray="5 4"/></svg></div></div></div>`).join('');
  const tun=$('#tuningList'); tun.innerHTML=`<div class="upgrade panel"><small>Las mejoras usan tus Coins normales de Streamer Arena.</small>${Object.entries(UP_NAMES).map(([k,n])=>{ const lvl=Number(p.upgrades?.[k]||0), cost=lvl<5?COSTS[lvl]:0; return `<div class="upgrade-row"><div><b>${n}</b><small>Nv ${lvl}/5</small></div><button data-up="${k}" ${lvl>=5?'disabled':''}>${lvl>=5?'MAX':'+'+cost+' 🪙'}</button></div>`; }).join('')}</div>`;
  carGrid.querySelectorAll('[data-select-car]').forEach(b=>b.onclick=()=>post('race-select-car',{carId:b.dataset.selectCar})); carGrid.querySelectorAll('[data-buy-car]').forEach(b=>b.onclick=()=>post('race-buy-car',{carId:b.dataset.buyCar})); trackList.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>post('race-select-track',{trackId:b.dataset.track})); tun.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>post('race-buy-upgrade',{key:b.dataset.up})); }
function resize(){ const dpr=Math.min(devicePixelRatio||1,2); const nw=Math.floor(innerWidth*dpr), nh=Math.floor(innerHeight*dpr); if(canvas.width!==nw||canvas.height!==nh){ canvas.width=nw; canvas.height=nh; W=nw; H=nh; ratio=dpr; } }
window.addEventListener('resize',resize); resize();
function drawPixelCar(x,y,w,h,color,dir=0){ ctx.save(); ctx.translate(x,y); ctx.scale(dir<0?-1:1,1); ctx.fillStyle=color; ctx.fillRect(-w*.34,-h*.22,w*.68,h*.44); ctx.fillRect(-w*.18,-h*.42,w*.36,h*.22); ctx.fillStyle='rgba(220,245,255,.68)'; ctx.fillRect(-w*.12,-h*.36,w*.24,h*.12); ctx.fillStyle='#fff'; ctx.fillRect(-w*.24,h*.18,w*.12,h*.14); ctx.fillRect(w*.12,h*.18,w*.12,h*.14); ctx.fillStyle='#232323'; ctx.fillRect(-w*.28,h*.18,w*.1,h*.18); ctx.fillRect(w*.18,h*.18,w*.1,h*.18); ctx.restore(); }
function drawViewport(vx,vy,vw,vh,camDist,player,opponent,label,isTop){ const track=currentTrack(); ctx.save(); ctx.beginPath(); ctx.rect(vx,vy,vw,vh); ctx.clip();
  const horizon=vy+vh*.35; const roadW=vw*.42; ctx.fillStyle=track.bgTop; ctx.fillRect(vx,vy,vw,horizon-vy); ctx.fillStyle=track.bgBottom; ctx.fillRect(vx,horizon,vw,vh-(horizon-vy));
  // skyline / mountains
  if(track===TRACKS.desert_run){ ctx.fillStyle='#d2a06d'; for(let i=0;i<6;i++){const mx=vx+i*vw/5-30; ctx.beginPath(); ctx.moveTo(mx, horizon+8); ctx.lineTo(mx+44, horizon-36-Math.abs(Math.sin(i))*18); ctx.lineTo(mx+96, horizon+8); ctx.fill(); }} else { for(let i=0;i<9;i++){ const bw=32+((i*31)%50), bh=24+((i*17)%60); const bx=vx+i*vw/8-12; ctx.fillStyle=i%2?'#1d253e':'#31384c'; ctx.fillRect(bx,horizon-bh,bw,bh); if(track===TRACKS.neon_city){ ctx.fillStyle='rgba(150,220,255,.4)'; for(let w=0;w<3;w++) for(let r=0;r<3;r++) ctx.fillRect(bx+6+w*8,horizon-bh+6+r*10,3,4);} } }
  const base=camDist; let x=0,dx=0; let maxy=vy+vh; const drawDist=170; const segLen=16;
  for(let n=drawDist;n>2;n--){ const z=n*segLen; const z2=(n-1)*segLen; const p1=1/(z*0.012+1), p2=1/(z2*0.012+1); const curve=roadCurveAt(base+z); dx += curve*0.0016; x += dx; const sx1=vx+vw/2 + x*vw*1.1 - player.lane*vw*.05; const sx2=vx+vw/2 + (x-dx)*vw*1.1 - player.lane*vw*.05; const w1=roadW*p1*2.2, w2=roadW*p2*2.2; const y1=horizon + (1-p1)*vh*.72; const y2=horizon + (1-p2)*vh*.72; if(y2>=maxy) continue; maxy=y2;
      ctx.fillStyle=(Math.floor((base+z)/40)%2)?track.grass:track.roadSide; ctx.fillRect(vx,y2,vw,y1-y2+1);
      ctx.beginPath(); ctx.moveTo(sx1-w1*1.1,y1); ctx.lineTo(sx1-w1,y1); ctx.lineTo(sx2-w2,y2); ctx.lineTo(sx2-w2*1.1,y2); ctx.closePath(); ctx.fillStyle='#c7353e'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(sx1+w1*1.1,y1); ctx.lineTo(sx1+w1,y1); ctx.lineTo(sx2+w2,y2); ctx.lineTo(sx2+w2*1.1,y2); ctx.closePath(); ctx.fillStyle='#c7353e'; ctx.fill();
      ctx.beginPath(); ctx.moveTo(sx1-w1,y1); ctx.lineTo(sx1+w1,y1); ctx.lineTo(sx2+w2,y2); ctx.lineTo(sx2-w2,y2); ctx.closePath(); ctx.fillStyle=(Math.floor((base+z)/32)%2)?'#5a5a5a':'#4b4b4b'; ctx.fill();
      // lane stripes
      ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=Math.max(1,3*p2); for(let l=-1;l<=1;l+=2){ const lx1=sx1+l*w1*.33, lx2=sx2+l*w2*.33; ctx.beginPath(); ctx.moveTo(lx1,y1); ctx.lineTo(lx2,y2); ctx.stroke(); }
      // roadside posts/lights
      if(n%12===0){ const poleH=26*p2*8; ctx.fillStyle='#faf6cc'; ctx.fillRect(sx2-w2*1.45,y2-poleH,2,poleH); ctx.fillRect(sx2+w2*1.45,y2-poleH,2,poleH); if(track!==TRACKS.desert_run){ ctx.fillStyle='rgba(255,240,160,.22)'; ctx.beginPath(); ctx.arc(sx2-w2*1.45,y2-poleH,5*p2*8,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(sx2+w2*1.45,y2-poleH,5*p2*8,0,Math.PI*2); ctx.fill(); } }
      if(track===TRACKS.desert_run && n%22===0){ ctx.fillStyle='#5c3d1e'; ctx.fillRect(sx2-w2*1.55,y2-14*p2*8,4,14*p2*8); ctx.fillRect(sx2+w2*1.55,y2-14*p2*8,4,14*p2*8); }
  }
  // opponent in view
  const delta=((opponent.dist-camDist)+totalTrackLength())%totalTrackLength(); if(delta>10 && delta<560){ const rel=delta/560; const sc=1-rel; const oy=horizon + vh*.62*rel; const curveOff=roadCurveAt(camDist+delta)*vw*.36; const ox=vx+vw/2 + curveOff + (opponent.lane-player.lane)*vw*.11*sc; drawPixelCar(ox,oy,40*sc+12,22*sc+8,opponent.isAI?'#ff555d':'#58b4ff',opponent.lane-player.lane); }
  // player's own car
  drawPixelCar(vx+vw/2 + player.lane*vw*.08, vy+vh*.82, 110, 56, player.color||'#f2f4f7',0);
  // HUD data local
  ctx.restore();
}
function posLabel(){ const r1=me.progress, r2=rival.progress; const pos = r1>=r2?1:2; return `${pos} / 2`; }
function updateHud(){ $('#hudTop').textContent=`${me.lap}/${parentState.game?.laps||3} Laps\n${Math.round(me.speed)} km/h\nPos ${posLabel()}\nNitro ${Math.round(me.nitro)}%`; $('#hudBottom').textContent=`${rival.lap}/${parentState.game?.laps||3} Laps\n${Math.round(rival.speed)} km/h\n${rival.isAI?'CPU':'Remote'}\nNitro ${Math.round(rival.nitro)}%`; }
function aiStep(dt){ if(!rival.isAI || mode!=='race') return; const t=carStats({carId:'vortex',upgrades:{engine:1,turbo:1,nitro:1,tires:1,brakes:0}}); const target=140+Math.sin(gameClock*.6)*16 + (me.progress>rival.progress?10:0); rival.speed=lerp(rival.speed,target,dt*.7); rival.lane=lerp(rival.lane,Math.sin(gameClock*.9)*1.1 + Math.sin(gameClock*.37)*.4,dt*.85); rival.nitro=clamp(rival.nitro + (rival.speed<target?8:-5)*dt,0,100); rival.dist += rival.speed*dt*3.8; rival.progress=clamp(rival.dist/totalTrackLength()*100,0,100); rival.lap=Math.min(parentState.game?.laps||3,Math.floor(rival.progress/(100/(parentState.game?.laps||3)))+1); if(rival.progress>=100){ rival.progress=100; rival.finished=true; } }
function remoteRivalSync(){ if(rival.isAI || !parentState.game) return; const oid=otherHuman(); const oc=parentState.game.cars?.[oid]||{}; rival.speed=Number(oc.speed||0); rival.lane=Number(oc.lane||0); rival.progress=Number(oc.progress||0); rival.dist=rival.progress/100*totalTrackLength(); rival.nitro=Number(oc.nitro??100); rival.fuel=Number(oc.fuel??100); rival.lap=Math.min(parentState.game?.laps||3,Math.floor(rival.progress/(100/(parentState.game?.laps||3)))+1); rival.finished=!!parentState.game?.winner; }
function playerStep(dt){ const st=carStats(parentState.profile); const nit=keys.nitro && me.nitro>0 && me.speed>35; if(keys.gas && me.fuel>0) me.speed+=st.accel*dt; else me.speed-=11*dt; if(keys.brake) me.speed-=st.brake*dt; if(nit){ me.speed += st.nitroBoost*dt; me.nitro -= 21*dt; } else me.nitro = clamp(me.nitro+6*dt,0,100); me.speed=clamp(me.speed,0,st.max+(nit?32:0)); me.fuel=clamp(me.fuel-me.speed*dt*0.0032,0,100); const steer=(keys.left?-1:0)+(keys.right?1:0); me.lane=clamp(me.lane + steer*dt*(1.5+st.handling/50),-1.6,1.6); const curvePenalty=Math.abs(roadCurveAt(me.dist))*10; me.dist += Math.max(0,me.speed-curvePenalty)*dt*3.8; me.progress=clamp(me.dist/totalTrackLength()*100,0,100); me.lap=Math.min(parentState.game?.laps||3,Math.floor(me.progress/(100/(parentState.game?.laps||3)))+1); if(me.progress>=100){ me.progress=100; me.finished=true; } }
function showResult(title,text){ $('#resultTitle').textContent=title; $('#resultText').textContent=text; $('#result').classList.remove('hidden'); }
$('#closeResultBtn').onclick=()=>$('#result').classList.add('hidden');
function maybeFinish(){ if(mode!=='race') return; if(!$('#result').classList.contains('hidden')) return; if(parentState.game?.winner){ const win=parentState.game.winner===parentState.myId; showResult(win?'¡Victoria!':'Carrera terminada', win?'+25 Coins para ti. Los demás reciben +10.':`${rival.name||'Rival'} ha ganado. Tú recibes +10.`); return; }
  if(parentState.game?.aiEnabled || rival.isAI){ if(localFinishedSent) return; if(me.finished || rival.finished){ localFinishedSent=true; const win=me.progress>=rival.progress; showResult(win?'¡Victoria contra la IA!':'Derrota contra la IA', win?'+25 Coins. La IA no cobra monedas.':'+10 Coins por completar la carrera.'); post('race-local-finish',{outcome:win?'win':'lose'}); } }
}
function draw(){ ctx.clearRect(0,0,W,H); if(mode==='garage'){ // animated attract screen background
    const track=currentTrack(); const top=0,bottom=H; drawViewport(0,0,W,H,gameClock*90,{lane:0,dist:gameClock*90,speed:120,lap:1,nitro:100},{lane:0,dist:gameClock*90+300,speed:110,isAI:true,name:'CPU'},'',true); ctx.fillStyle='rgba(0,0,0,.52)'; ctx.fillRect(0,0,W,H); return; }
  const half=H/2; drawViewport(0,0,W,half,me.dist,me,rival,'top',true); drawViewport(0,half+2,W,half-2,rival.dist,rival,me,'bottom',false); updateHud(); }
function loop(ts){ requestAnimationFrame(loop); const dt=Math.min(.033,(ts-last)/1000||.016); last=ts; gameClock+=dt; if(mode==='race' && $('#result').classList.contains('hidden')){ playerStep(dt); aiStep(dt); remoteRivalSync(); if(ts-lastTickPost>330){ post('race-tick',{progress:me.progress,speed:me.speed,fuel:me.fuel,nitro:me.nitro,lane:me.lane}); lastTickPost=ts; } maybeFinish(); }
  draw(); }
function bindHold(id,key){ const el=$(id); const on=e=>{e.preventDefault(); keys[key]=true;}; const off=e=>{keys[key]=false;}; el.addEventListener('pointerdown',on); ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,off)); }
['left','gas','brake','nitro','right'].forEach(k=>bindHold('#'+k+'Btn',k));
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase(); if(k==='w'||e.key==='ArrowUp')keys.gas=true; if(k==='s'||e.key==='ArrowDown')keys.brake=true; if(k==='a'||e.key==='ArrowLeft')keys.left=true; if(k==='d'||e.key==='ArrowRight')keys.right=true; if(e.key==='Shift'||e.code==='Space')keys.nitro=true;});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase(); if(k==='w'||e.key==='ArrowUp')keys.gas=false; if(k==='s'||e.key==='ArrowDown')keys.brake=false; if(k==='a'||e.key==='ArrowLeft')keys.left=false; if(k==='d'||e.key==='ArrowRight')keys.right=false; if(e.key==='Shift'||e.code==='Space')keys.nitro=false;});
$('#garageRefreshBtn').onclick=()=>renderGarage(); $('#garagePreviewBtn').onclick=()=>{ previewMode=!previewMode; $('#garagePreviewBtn').textContent=previewMode?'■ Vista fija':'▶ Vista previa'; };
window.addEventListener('message',e=>{const d=e.data; if(d?.source==='streamer-arena' && d.type==='race-state') applyParentState(d);});
resize(); renderGarage(); requestAnimationFrame(loop); post('race-ready');
</script></body></html>
