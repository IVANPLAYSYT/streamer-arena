function renderGarage(tab=document.querySelector('.tabs .active')?.dataset.tab||'cars'){const p=parentState.profile,$b=$('#tabBody');$$('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));$('#coins').textContent=parentState.coins||0;$('#garageTitle').textContent=$('#heroCarName').textContent=CARS[p.carId]?.name||'Falcon R';$('#heroStats').innerHTML=`<span>Vel. ${Math.round(carStats(p).max)} km/h</span><span>Motor Nv ${p.upgrades?.engine||0}</span><span>Turbo Nv ${p.upgrades?.turbo||0}</span><span>Nitro Nv ${p.upgrades?.nitro||0}</span>`;$('#startRaceBtn').disabled=!parentState.isHost;$('#startRaceBtn').textContent=parentState.isHost?'🏁 Iniciar carrera':'Esperando al host';
 if(tab==='cars'){$b.innerHTML=`<div class="list">${Object.entries(CARS).map(([id,c])=>{const own=(p.ownedCars||[]).includes(id),sel=p.carId===id;return `<div class="card ${sel?'selected':''}"><div class="cardhead"><div><b>${c.name}</b><small>${own?'En tu garaje':c.price+' Coins'}</small></div>${own?`<button data-select="${id}" ${sel?'disabled':''}>${sel?'Activo':'Elegir'}</button>`:`<button data-buy="${id}">Comprar</button>`}</div><div class="stats"><div class="stat">Velocidad ${c.max}</div><div class="stat">Aceleración ${c.accel}</div><div class="stat">Agarre ${c.handling}</div><div class="stat">Nitro ${c.nitro}</div></div></div>`}).join('')}</div><div class="color-row">${['#f2f4f7','#1e78ff','#ef4148','#ffd12c','#141820','#9650ff'].map(c=>`<button class="color-dot ${p.color===c?'active':''}" data-color="${c}" style="background:${c}"></button>`).join('')}</div>`}
 if(tab==='tuning'){$b.innerHTML=`<div class="list">${Object.entries(UP).map(([k,u])=>{const lv=Number(p.upgrades?.[k]||0),cost=lv<5?COST[lv]:0;return `<div class="upgrade"><div><b>${u.name}</b><span class="lvl">Nv ${lv}/5</span><p>${u.desc}</p></div><button data-up="${k}" ${lv>=5?'disabled':''}>${lv>=5?'MAX':cost+' 🪙'}</button></div>`}).join('')}</div><div class="card" style="margin-top:10px"><b>Turbo</b><small>No usa otra tecla: funciona automáticamente al acelerar. Cuanto mayor sea su nivel, antes carga y más empuje entrega.</small><b style="display:block;margin-top:8px">Nitro</b><small>Pulsa <b>E</b> durante la carrera.</small></div>`}
 if(tab==='tracks'){$b.innerHTML=`<div class="list">${Object.entries(TRACKS).map(([id,t])=>`<div class="card ${p.trackId===id?'selected':''}"><div class="cardhead"><div><b>${t.name}</b><small>${t.laps} vueltas · ${t.night?'Nocturna':'Día'}</small></div><div class="track-mini"><svg viewBox="0 0 110 76"><rect width="110" height="76" fill="#08111d"/><path d="M15 57 C18 28 38 15 57 25 C76 35 70 57 91 20" fill="none" stroke="#e8eef8" stroke-width="7" stroke-linecap="round"/><path d="M15 57 C18 28 38 15 57 25 C76 35 70 57 91 20" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/></svg></div></div><button style="margin-top:8px" data-track="${id}" ${!parentState.isHost||p.trackId===id?'disabled':''}>${p.trackId===id?'Elegida':parentState.isHost?'Elegir':'Solo host'}</button></div>`).join('')}</div>`}
 $b.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>post('race-select-car',{carId:b.dataset.select}));$b.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>post('race-buy-car',{carId:b.dataset.buy}));$b.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>post('race-set-color',{color:b.dataset.color}));$b.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>post('race-buy-upgrade',{key:b.dataset.up}));$b.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>post('race-select-track',{trackId:b.dataset.track}));}
function setupRaceState(){const gs=parentState.game||{};const mc=gs.cars?.[parentState.myId]||{};me.speed=Number(mc.speed||0);me.lane=Number(mc.lane||0);me.progress=Number(mc.progress||0);me.nitro=Number(mc.nitro??100);me.fuel=Number(mc.fuel??100);me.finished=false;me.color=parentState.profile.color||'#fff';const oid=otherHuman(),oc=oid?gs.cars?.[oid]:null;rival.isAI=!!gs.aiEnabled||!oid;rival.name=rival.isAI?'CPU Night':(gs.players||[]).find(x=>x.id===oid)?.name||'Jugador 2';rival.color=rival.isAI?'#e83f4f':(oc?.color||'#4d98ff');rival.carId=rival.isAI?'vortex':(oc?.carId||'vortex');rival.speed=Number(oc?.speed||125);rival.lane=Number(oc?.lane||0);rival.progress=Number(oc?.progress||0);rival.nitro=Number(oc?.nitro??100);rival.turbo=0;rival.finished=false;localFinished=false;$('#p1name').textContent=parentState.myName||'Jugador';$('#p2mode').textContent=opponentLabel();$('#p2name').textContent=rival.name}
async function applyState(d){parentState={...parentState,...d,profile:{...parentState.profile,...(d.profile||{}),upgrades:{...parentState.profile.upgrades,...(d.profile?.upgrades||{})}}};mode=d.mode||mode;if(mode==='garage'){$('#garageUI').classList.remove('hidden');$('#raceUI').classList.add('hidden');buildGarage();await setGarageCar();renderGarage()}else{$('#garageUI').classList.add('hidden');$('#raceUI').classList.remove('hidden');buildRaceWorld(d.game?.trackId||parentState.profile.trackId||'neon_city');setupRaceState();await ensureRaceCars();$('#result').classList.add('hidden')}}
function syncRemote(){if(rival.isAI)return;const oid=otherHuman(),oc=parentState.game?.cars?.[oid]||{};rival.speed=Number(oc.speed||0);rival.lane=Number(oc.lane||0);rival.progress=Number(oc.progress||0);rival.nitro=Number(oc.nitro??100);rival.finished=!!parentState.game?.winner}
function playerStep(dt,canDrive){const s=carStats(parentState.profile);if(!canDrive){me.speed=Math.max(0,me.speed-30*dt);me.nitroOn=false;return}const throttle=keys.gas?1:0;me.turbo=clamp(me.turbo+(throttle?s.turboGain:-.65)*dt,0,1);const boost=me.turbo*s.turboPower;if(keys.gas&&me.fuel>0)me.speed+=(s.accel+boost)*dt;else me.speed-=10*dt;if(keys.brake)me.speed-=s.brake*dt;const nit=keys.nitro&&me.nitro>0&&me.speed>30;me.nitroOn=nit;if(nit){me.speed+=s.nitroBoost*dt;me.nitro-=23*dt}else me.nitro=Math.min(100,me.nitro+4*dt);me.speed=clamp(me.speed,0,s.max+(nit?38:0));me.fuel=clamp(me.fuel-me.speed*dt*.0013,0,100);const steer=(keys.left?-1:0)+(keys.right?1:0);me.steer=steer;me.lane=clamp(me.lane+steer*dt*(1.4+s.handling/48),-roadWidth*.33,roadWidth*.33);const curv=trackCurve.getTangentAt((me.progress/100)%1);const curvePenalty=Math.abs(curv.x)*1.5;me.progress=clamp(me.progress+(Math.max(0,me.speed-curvePenalty)*dt)/(trackLength*3.6)*100,0,100);if(me.progress>=100)me.finished=true}
function aiStep(dt,canDrive){if(!rival.isAI||!canDrive)return;const t=(rival.progress/100)%1,tan=trackCurve.getTangentAt(t);const curve=Math.abs(tan.x);const target=145-curve*26+(me.progress>rival.progress?8:0);rival.turbo=clamp(rival.turbo+(target>rival.speed?.32:-.4)*dt,0,1);rival.speed=THREE.MathUtils.lerp(rival.speed,target+rival.turbo*14,dt*.55);rival.lane=THREE.MathUtils.lerp(rival.lane,Math.sin(performance.now()*.0007)*1.1,dt*.8);rival.progress=clamp(rival.progress+(rival.speed*dt)/(trackLength*3.6)*100,0,100);rival.nitro=Math.min(100,rival.nitro+2*dt);if(rival.progress>=100)rival.finished=true}
function hudHTML(s,name){const laps=parentState.game?.laps||3,lap=Math.min(laps,Math.floor(s.progress/(100/laps))+1);return `<div class="hudrow"><span>${lap}/${laps} VUELTAS</span><b>${name}</b></div><div class="speed">${Math.round(s.speed)} km/h</div><div class="hudrow"><span>Nitro</span><b>${Math.round(s.nitro)}%</b></div><div class="meter"><i style="width:${clamp(s.nitro,0,100)}%"></i></div><div class="hudrow" style="margin-top:5px"><span>Turbo</span><b>${Math.round((s.turbo||0)*100)}%</b></div><div class="meter turbo"><i style="width:${clamp((s.turbo||0)*100,0,100)}%"></i></div>`}
function countdownState(){const st=Number(parentState.game?.startedAt||Date.now()),elapsed=(Date.now()-st)/1000;if(elapsed<1)return{drive:false,text:'3'};if(elapsed<2)return{drive:false,text:'2'};if(elapsed<3)return{drive:false,text:'1'};if(elapsed<3.7)return{drive:true,text:'GO!'};return{drive:true,text:''}}
function showResult(title,text){if(!$('#result').classList.contains('hidden'))return;$('#resultTitle').textContent=title;$('#resultText').textContent=text;$('#result').classList.remove('hidden')}
function finishLogic(){if(mode!=='race')return;if(parentState.game?.winner){const win=parentState.game.winner===parentState.myId;showResult(win?'¡Victoria!':'Carrera terminada',win?'+25 Coins. Los demás reciben +10.':`${rival.name} ha ganado. Recibes +10 Coins.`);return}if(rival.isAI&&!localFinished&&(me.finished||rival.finished)){localFinished=true;const win=me.progress>=rival.progress;showResult(win?'¡Victoria contra la IA!':'La IA gana',win?'+25 Coins para ti.':'+10 Coins por participar.');post('race-local-finish',{outcome:win?'win':'lose'})}}
function renderRace(){const rect=renderer.domElement.getBoundingClientRect(),w=Math.max(1,rect.width),h=Math.max(2,rect.height),half=Math.floor(h/2);renderer.setScissorTest(true);updateCamera(cam1,me,me.speed);placeCar(meCar,me);placeCar(rivalCar,rival);renderer.setViewport(0,half,w,h-half);renderer.setScissor(0,half,w,h-half);cam1.aspect=w/(h-half);cam1.updateProjectionMatrix();renderer.render(raceScene,cam1);updateCamera(cam2,rival,rival.speed);renderer.setViewport(0,0,w,half);renderer.setScissor(0,0,w,half);cam2.aspect=w/half;cam2.updateProjectionMatrix();renderer.render(raceScene,cam2);renderer.setScissorTest(false);$('#hud1').innerHTML=hudHTML(me,parentState.myName||'P1');$('#hud2').innerHTML=hudHTML(rival,rival.name);const c=countdownState();$('#countdown').textContent=c.text}
function renderGarage3D(dt){if(garageCar){garageTurn+=dt*.35;garageCar.rotation.y=garageTurn}const r=renderer.domElement.getBoundingClientRect();garageCam.aspect=Math.max(.1,r.width/r.height);garageCam.updateProjectionMatrix();renderer.setViewport(0,0,r.width,r.height);renderer.setScissorTest(false);renderer.render(garageScene,garageCam)}
function resize(){const r=$('#stage').getBoundingClientRect();renderer.setSize(r.width,r.height,false)}new ResizeObserver(resize).observe($('#stage'));resize();
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;if(mode==='garage'){renderGarage3D(dt);return}const c=countdownState();if($('#result').classList.contains('hidden')){playerStep(dt,c.drive);aiStep(dt,c.drive);syncRemote();if(ts-lastPost>330){post('race-tick',{progress:me.progress,speed:me.speed,fuel:me.fuel,nitro:me.nitro,lane:me.lane});lastPost=ts}finishLogic()}renderRace()}
function bindHold(id,key){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>keys[key]=false))}bindHold('#leftBtn','left');bindHold('#rightBtn','right');bindHold('#gasBtn','gas');bindHold('#brakeBtn','brake');bindHold('#nitroBtn','nitro');
window.addEventListener('keydown',e=>{if(['INPUT','BUTTON','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;const k=e.key.toLowerCase();if(k==='w'||e.key==='ArrowUp')keys.gas=true;if(k==='s'||e.key==='ArrowDown')keys.brake=true;if(k==='a'||e.key==='ArrowLeft')keys.left=true;if(k==='d'||e.key==='ArrowRight')keys.right=true;if(k==='e')keys.nitro=true});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='w'||e.key==='ArrowUp')keys.gas=false;if(k==='s'||e.key==='ArrowDown')keys.brake=false;if(k==='a'||e.key==='ArrowLeft')keys.left=false;if(k==='d'||e.key==='ArrowRight')keys.right=false;if(k==='e')keys.nitro=false});
$$('[data-tab]').forEach(b=>b.onclick=()=>renderGarage(b.dataset.tab));$('#startRaceBtn').onclick=()=>{if(parentState.isHost)post('race-start-request')};$('#closeResultBtn').onclick=()=>$('#result').classList.add('hidden');
window.addEventListener('message',e=>{const d=e.data;if(d?.source==='streamer-arena'&&d.type==='race-state')applyState(d)});buildGarage();setGarageCar();renderGarage('cars');requestAnimationFrame(loop);post('race-ready');
</script></body></html>
